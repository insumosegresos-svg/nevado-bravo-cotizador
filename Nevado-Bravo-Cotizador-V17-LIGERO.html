<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nevado Bravo — Calculadora de ventas</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:Arial,sans-serif;background:#f4f1e9;color:#183d32}
.wrap{max-width:520px;margin:auto;padding:16px}.card{background:#fff;border-radius:18px;padding:18px;box-shadow:0 5px 20px #0001;margin-bottom:14px}
.logo{width:100%;max-height:180px;object-fit:contain;border-radius:12px} h1{font-size:24px;margin:8px 0 4px;text-align:center}
.sub{text-align:center;color:#777;margin-bottom:18px} label{font-weight:700;display:block;margin:14px 0 7px}
select,input{width:100%;padding:14px;border:1px solid #ccc;border-radius:10px;font-size:17px;background:#fff}
.channels{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}.channels button{padding:11px 5px;border:1px solid #183d32;border-radius:10px;background:#fff;color:#183d32;font-weight:700}
.channels button.active{background:#183d32;color:#fff}.price{text-align:center;font-size:20px;margin:18px 0 5px}
.total{text-align:center;font-size:34px;font-weight:800;color:#a12d2d;margin:4px 0 16px}
button.main{width:100%;padding:15px;border:0;border-radius:11px;background:#a12d2d;color:#fff;font-size:18px;font-weight:800}
button.secondary{width:100%;padding:12px;border:1px solid #183d32;border-radius:11px;background:#fff;color:#183d32;font-size:16px;font-weight:700;margin-top:9px}
.note{font-size:13px;color:#777;text-align:center;line-height:1.4} #quote{white-space:pre-wrap;background:#f7f7f7;border-radius:10px;padding:12px;display:none;margin-top:12px;font-size:14px}

.cart-item{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid #ddd;font-size:14px}
.cart-remove{border:0;background:#a12d2d;color:#fff;border-radius:7px;padding:5px 8px}
.cart-total{font-size:23px;font-weight:800;text-align:right;margin-top:12px;color:#a12d2d}
.cart-empty{text-align:center;color:#777;font-size:13px;padding:10px}

.app-brand{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:6px}
.app-brand img{width:62px;height:62px;object-fit:contain;border-radius:8px}
.app-brand h1{margin:0}
.tagline{
  text-align:right;
  font-family:"Brush Script MT","Segoe Script","Lucida Handwriting",cursive;
  font-style:italic;
  font-weight:500;
  color:#a53b3b;
  font-size:22px;
  line-height:1.05;
  position:relative;
  padding-bottom:9px;
  margin-left:auto;
  width:max-content;
}.descriptor{font-size:11px;font-weight:800;letter-spacing:.4px;color:#183d32;text-align:center}
.quote-data{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 18px}
.quote-data .field label{display:block;font-weight:700;margin-bottom:6px}
.quote-data input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ccc;border-radius:10px;font-size:16px;background:#fff}
@media(max-width:520px){.quote-data{grid-template-columns:1fr}}
.quote-preview{background:#fff;border-radius:14px;padding:16px;margin-top:14px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.quote-head{display:flex;align-items:center;gap:10px;border-bottom:1px solid #ddd;padding-bottom:10px;margin-bottom:10px}
.quote-head img{width:48px;height:48px;object-fit:contain}
.quote-meta{font-size:14px;line-height:1.6}

.tagline::after{
  content:"";
  display:block;
  width:115px;
  height:3px;
  margin:5px 0 0 auto;
  background:#b52f2f;
  border-radius:4px;
}
</style>
</head>

r con carácter</div></div></div>
<div class="quote-data">
  <div class="field">
    <label>Nombre del cliente</label>
    <input id="customer" type="text" placeholder="Opcional">
  </div>
  <div class="field">
    <label>Fecha</label>
    <input id="quoteDate" type="date">
  </div>
  <div class="field">
    <label>Domicilio del cliente</label>
    <input id="customerAddress" type="text" placeholder="Opcional">
  </div>
</div>
<div class="sub">Calculadora de ventas · Sabor con carácter</div>
<label>Canal de venta</label><div class="channels">
<button id="c1" onclick="setChannel(1)">Canal 1<br><small>Tiendas</small></button>
<button id="c2" onclick="setChannel(2)">Canal 2<br><small>Food Service</small></button>
<button id="c3" onclick="setChannel(3)">Canal 3<br><small>Público</small></button></div>
<label>Producto</label><select id="product" onchange="calc()"></select>
<label>Cantidad (kg)</label>
<input id="qty" type="number" min="0.1" step="0.1" value="1" oninput="calc()">
<div class="price" id="price">Precio: $170/kg</div>
<div class="total" id="total">$170.00</div>

<button class="main" onclick="addToQuote()">+ AGREGAR PRODUCTO</button>

<div id="cart" style="margin-top:16px"></div>

<button class="main" onclick="makeQuote()" style="margin-top:10px">GENERAR COTIZACIÓN</button>
<button class="main" onclick="sendWhatsApp()" style="margin-top:10px;background:#168c4a">ENVIAR POR WHATSAPP</button>
<button class="secondary" onclick="shareVisualQuote()" style="margin-top:10px">GENERAR Y COMPARTIR COTIZACIÓN VISUAL</button>
<div id="quote"></div></div>
<div class="card note">Precios en pesos mexicanos. Primera versión: únicamente precios de venta de los tres canales.</div>
</div>
<script>
const products = [['Longaniza natural',170,180,220],['Chorizo rojo almendrado',170,180,220],['Chorizo verde almendrado',170,180,220],['Chorizo mango habanero almendrado',170,180,220],['Chorizo Español',180,200,240],['Chistorra',210,240,270],['Chorizo Argentino',210,240,270],['Cecina natural (para asar)',330,350,390],['Cecina adobada (para asar)',330,350,370]];
let channel = 1;
let quoteItems = [];
let currentFolio = null;

const productSelect = document.getElementById("product");

products.forEach((p, i) => {
  const option = document.createElement("option");
  option.value = i;
  option.textContent = p[0];
  productSelect.appendChild(option);
});

function money(n) {
  return Number(n).toLocaleString("es-MX", {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  });
}

function setChannel(c) {
  channel = Number(c);
  [1,2,3].forEach(x => {
    const el = document.getElementById("c"+x);
    if (el) el.classList.toggle("active", x === channel);
  });
  // Al cambiar de canal, se limpia la cotización para no mezclar tarifas.
  quoteItems = [];
  currentFolio = null;
  renderQuote();
  calc();
}

function calc() {
  const p = products[Number(productSelect.value)] || products[0];
  const qty = Number(document.getElementById("qty").value) || 0;
  const price = p[channel];
  document.getElementById("price").textContent =
    "Precio: $" + Number(price).toLocaleString("es-MX") + "/kg";
  document.getElementById("total").textContent = "$" + money(price * qty);
}

function addToQuote() {
  const p = products[Number(productSelect.value)];
  const qty = Number(document.getElementById("qty").value);

  if (!qty || qty <= 0) {
    alert("Primero indica los kilos.");
    return;
  }

  const price = p[channel];

  quoteItems.push({
    product: p[0],
    kg: qty,
    price: price,
    subtotal: qty * price
  });

  renderQuote();
  document.getElementById("qty").value = 1;
  calc();
}

function removeFromQuote(index) {
  quoteItems.splice(index, 1);
  renderQuote();
}

function renderQuote() {
  const box = document.getElementById("cart");
  if (!quoteItems.length) {
    box.innerHTML = '<div class="cart-empty">No hay productos agregados todavía.</div>';
    return;
  }

  let total = 0;
  const rows = quoteItems.map((item, index) => {
    total += item.subtotal;
    return `<div class="cart-item">
      <div><b>${item.product}</b><br>${item.kg} kg × $${money(item.price)} = <b>$${money(item.subtotal)}</b></div>
      <button class="cart-remove" onclick="removeFromQuote(${index})">Quitar</button>
    </div>`;
  }).join("");

  box.innerHTML = rows + `<div class="cart-total">TOTAL: $${money(total)}</div>`;
}

function nextFolio() {
  let n = parseInt(localStorage.getItem("nevadoBravoFolio") || "0", 10) + 1;
  localStorage.setItem("nevadoBravoFolio", String(n));
  return "NB-" + String(n).padStart(4, "0");
}

function getQuoteDate() {
  const d = document.getElementById("quoteDate").value;
  if (!d) return new Date().toLocaleDateString("es-MX");
  const [y,m,day] = d.split("-");
  return `${day}/${m}/${y}`;
}

function customerName() {
  return (document.getElementById("customer").value || "").trim();
}

function customerAddress() {
  return (document.getElementById("customerAddress").value || "").trim();
}

function getChannelName() {
  return channel === 1 ? "CANAL 1 · TIENDAS Y ABARROTES" :
         channel === 2 ? "CANAL 2 · FOOD SERVICE" :
                         "CANAL 3 · PÚBLICO";
}

function buildQuoteText(folio) {
  let total = 0;

  const lines = quoteItems.map((item, i) => {
    total += item.subtotal;
    return `${i + 1}. ${item.product}\n   ${item.kg} kg × $${money(item.price)} = $${money(item.subtotal)}`;
  }).join("\n\n");

  const customer = customerName();
  const address = customerAddress();
  const dateText = getQuoteDate();
  const channelName = getChannelName();

  return `NEVADO BRAVO®
CHORIZOS Y EMBUTIDOS · ESTILO TOLUCA
Sabor con carácter

COTIZACIÓN
Folio: ${folio}
Fecha: ${dateText}
${customer ? `Cliente: ${customer}\n` : ""}Canal: ${channelName}${address ? `\nDomicilio: ${address}` : ""}

${lines}

TOTAL: $${money(total)}

Producto empacado al alto vacío.
Mantener en refrigeración (4 °C).

Gracias por confiar en los productos de Nevado Bravo®.`;
}

function makeQuote() {
  if (!quoteItems.length) {
    alert("Agrega productos primero.");
    return;
  }
  if (!currentFolio) currentFolio = nextFolio();

  const text = buildQuoteText(currentFolio);
  const q = document.getElementById("quote");
  q.textContent = text;
  q.style.display = "block";
}

function sendWhatsApp() {
  if (!quoteItems.length) {
    alert("Agrega productos primero.");
    return;
  }
  if (!currentFolio) currentFolio = nextFolio();

  const text = buildQuoteText(currentFolio);
  window.location.href = "https://wa.me/?text=" + encodeURIComponent(text);
}

async function shareVisualQuote() {
  if (!quoteItems.length) { alert("Agrega productos primero."); return; }
  if (!currentFolio) currentFolio = nextFolio();

  const folio = currentFolio;
  const customer = customerName();
  const address = customerAddress();
  const dateText = getQuoteDate();
  const channelName = getChannelName();

  let total = 0;
  quoteItems.forEach(item => total += item.subtotal);

  const W = 1400;
  const headerH = 430;
  const infoH = address ? 245 : 185;
  const tableHeaderH = 78;
  const rowH = 92;
  const totalH = 135;
  const notesH = 345;
  const footerH = 190;

  const canvas = document.createElement("canvas");
  const ctx = canvas.getContext("2d");
  canvas.width = W;
  canvas.height = headerH + infoH + tableHeaderH + quoteItems.length * rowH + totalH + notesH + footerH;
  ctx.fillStyle = "#fff";
  ctx.fillRect(0, 0, W, canvas.height);

  const logo = new Image();
  logo.src = document.getElementById("appLogo")?.src || "";
  await new Promise(resolve => { logo.onload = resolve; logo.onerror = resolve; });

  if (logo.complete && logo.naturalWidth) {
    const lh = 190, ratio = logo.naturalWidth / logo.naturalHeight;
    const lw = Math.min(lh * ratio, 175);
    ctx.drawImage(logo, 55, 48, lw, lh);
  }

  ctx.fillStyle = "#073d32";
  ctx.font = "bold 70px Georgia, serif";
  ctx.fillText("NEVADO BRAVO®", 285, 125);

  ctx.fillStyle = "#bd8b1d";
  ctx.font = "bold 29px Arial, sans-serif";
  ctx.fillText("CHORIZOS Y EMBUTIDOS · ESTILO TOLUCA", 290, 178);

  // Slogan: smaller, red, italic, upper-right.
  ctx.fillStyle = "#b52d2d";
  ctx.font = "italic 28px Georgia, serif";
  ctx.textAlign = "right";
  ctx.fillText("Sabor con carácter", W - 55, 178);
  ctx.textAlign = "left";

  // Tricolor line.
  ctx.fillStyle = "#0b493b"; ctx.fillRect(45, 315, 470, 8);
  ctx.fillStyle = "#ddd"; ctx.fillRect(515, 315, 330, 8);
  ctx.fillStyle = "#b52d2d"; ctx.fillRect(845, 315, W - 890, 8);

  // Lowered and slightly smaller title.
  ctx.fillStyle = "#073d32";
  ctx.font = "bold 50px Georgia, serif";
  ctx.fillText("COTIZACIÓN", 45, 390);

  ctx.fillStyle = "#111";
  ctx.font = "bold 27px Arial";
  ctx.fillText("Folio:", 1080, 386);
  ctx.fillStyle = "#b52d2d";
  ctx.font = "bold 31px Arial";
  ctx.fillText(folio, 1190, 386);

  let y = headerH;
  ctx.fillStyle = "#f0f5f2";
  ctx.fillRect(45, y, W - 90, infoH - 15);

  ctx.strokeStyle = "#a9c0b8"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(470, y+25); ctx.lineTo(470, y+infoH-40); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(900, y+25); ctx.lineTo(900, y+infoH-40); ctx.stroke();

  ctx.fillStyle = "#111";
  ctx.font = "bold 25px Arial"; ctx.fillText("Fecha:", 90, y+62);
  ctx.font = "25px Arial"; ctx.fillText(dateText, 90, y+100);

  ctx.font = "bold 25px Arial"; ctx.fillText("Cliente:", 520, y+62);
  ctx.font = "25px Arial"; ctx.fillText((customer || "—").slice(0,32), 520, y+100);

  ctx.font = "bold 25px Arial"; ctx.fillText("Canal:", 950, y+62);
  ctx.font = "22px Arial";
  ctx.fillText(channelName.length > 27 ? channelName.replace("CANAL ", "C. ") : channelName, 950, y+100);

  if (address) {
    ctx.font = "bold 25px Arial"; ctx.fillText("Domicilio:", 90, y+155);
    ctx.font = "24px Arial";
    ctx.fillText(address.length > 75 ? address.slice(0,75) + "…" : address, 90, y+195);
  }

  y += infoH;

  const xNum = 70, xProduct = 150, xQty = 760, xUnit = 950, xRight = 1325;
  ctx.fillStyle = "#073d32";
  ctx.fillRect(45, y, W-90, tableHeaderH);

  ctx.fillStyle = "#fff"; ctx.font = "bold 23px Arial";
  ctx.fillText("#", xNum, y+49);
  ctx.fillText("PRODUCTO", xProduct, y+49);
  ctx.fillText("CANTIDAD", xQty, y+49);
  ctx.fillText("P. UNITARIO", xUnit, y+49);
  ctx.fillText("SUBTOTAL", 1170, y+49);

  y += tableHeaderH;

  quoteItems.forEach((item, i) => {
    ctx.fillStyle = i % 2 === 0 ? "#fff" : "#fafafa";
    ctx.fillRect(45, y, W-90, rowH);
    ctx.strokeStyle = "#d2d8d5"; ctx.lineWidth = 1; ctx.strokeRect(45, y, W-90, rowH);

    ctx.fillStyle = "#111"; ctx.font = "24px Arial"; ctx.fillText(String(i+1), xNum, y+57);
    ctx.font = "bold 23px Arial";
    ctx.fillText(item.product.length > 43 ? item.product.slice(0,43) + "…" : item.product, xProduct, y+57);

    ctx.font = "24px Arial"; ctx.textAlign = "center";
    ctx.fillText(item.kg + " kg", xQty + 45, y+57);
    ctx.fillText("$" + money(item.price), xUnit + 70, y+57);
    ctx.textAlign = "right";
    ctx.fillText("$" + money(item.subtotal), xRight, y+57);
    ctx.textAlign = "left";
    y += rowH;
  });

  ctx.fillStyle = "#eef4f1"; ctx.fillRect(45, y+22, W-90, totalH);
  ctx.fillStyle = "#073d32"; ctx.font = "bold 49px Arial"; ctx.fillText("TOTAL:", 70, y+97);
  ctx.fillStyle = "#b52d2d"; ctx.font = "bold 58px Arial"; ctx.textAlign = "right";
  ctx.fillText("$" + money(total), xRight, y+97); ctx.textAlign = "left";

  y += totalH + 72;
  ctx.strokeStyle = "#9aa8a3"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(45,y); ctx.lineTo(W-45,y); ctx.stroke();

  ctx.fillStyle = "#111"; ctx.font = "24px Arial";
  ctx.fillText("Producto empacado al alto vacío.", 90, y+62);
  ctx.fillText("Mantener en refrigeración (4 °C).", 90, y+115);
  ctx.fillText("Productos listos para su preparación.", 90, y+168);

  y += notesH;
  ctx.strokeStyle = "#073d32"; ctx.beginPath(); ctx.moveTo(45,y); ctx.lineTo(W-45,y); ctx.stroke();

  ctx.fillStyle = "#073d32"; ctx.font = "bold 27px Georgia, serif"; ctx.textAlign = "center";
  ctx.fillText("Gracias por confiar en los productos de Nevado Bravo®.", W/2, y+85);
  ctx.fillStyle = "#0b493b"; ctx.fillRect(W/2-125, y+115, 82, 8);
  ctx.fillStyle = "#ddd"; ctx.fillRect(W/2-43, y+115, 86, 8);
  ctx.fillStyle = "#b52d2d"; ctx.fillRect(W/2+43, y+115, 82, 8);
  ctx.textAlign = "left";

  canvas.toBlob(async blob => {
    if (!blob) { alert("No se pudo generar la imagen."); return; }
    const file = new File([blob], "Cotizacion_Nevado_Bravo_" + folio + ".png", {type:"image/png"});
    if (navigator.share && navigator.canShare && navigator.canShare({files:[file]})) {
      try {
        await navigator.share({
          title: "Cotización Nevado Bravo® · " + folio,
          text: "Cotización Nevado Bravo® · Folio " + folio,
          files: [file]
        });
      } catch(e) {}
    } else {
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = file.name; a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      alert("Se descargó la cotización visual para compartirla por WhatsApp.");
    }
  }, "image/png");
}

document.getElementById("quoteDate").value = new Date().toISOString().slice(0,10);
setChannel(1);
calc();
</script></body></html>
